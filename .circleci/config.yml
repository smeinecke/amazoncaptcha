version: 2.1

shared: &shared
  steps:
    - checkout
    - run:
        name: Install uv and Python deps
        command: |
          pip install uv
          uv sync --group dev
    - run:
        name: Running tests
        command: |
          uv run coverage run -m unittest tests/test_main.py
    - run: |
        if [ $UPLOAD_COV ]; then
          uv run codecov
        fi

jobs:
  py310:
    <<: *shared
    docker:
      - image: cimg/python:3.10
        environment:
          UPLOAD_COV: "true"

  py311:
    <<: *shared
    docker:
      - image: cimg/python:3.11
        environment:
          UPLOAD_COV: "true"

  py312:
    <<: *shared
    docker:
      - image: cimg/python:3.12
        environment:
          UPLOAD_COV: "true"

  py313:
    <<: *shared
    docker:
      - image: cimg/python:3.13
        environment:
          UPLOAD_COV: "true"

workflows:
  version: 2.1
  main:
    jobs:
      - py310
      - py311
      - py312
      - py313
